{% load taskmonitor %}

{% random_id as data_id %}

{{ series|json_script:data_id }}
<figure class="highcharts-figure">
    <div id="{{ data_id }}-container" style="width: 100%;"></div>
    <script>
        ( () => {
            const series = JSON.parse(document.getElementById("{{ data_id }}").textContent);
            Highcharts.chart('{{ data_id }}-container', {
                chart: {
                    type: 'area',
                },
                credits: {
                    enabled: false
                },
                title: null,
                legend: false,
                plotOptions: {
                    bar: {
                        dataLabels: {
                            enabled: true
                        }
                    }
                },
                xAxis: {
                    type: 'datetime',
                },
                series: series,
                });
        } )();
    </script>
</figure>
