{% load taskmonitor %}

{% random_id as data_id %}

{{ data|json_script:data_id }}
<figure class="highcharts-figure">
    <div id="{{ data_id }}-container" style="width: 100%;"></div>
    <script>
        fetch("{% url 'taskmonitor:admin_taskmonitor_report_data' report_name %}")
            .then((response) => response.json())
            .then((data) => {
                Highcharts.chart('{{ data_id }}-container', {
                    chart: {
                        plotBackgroundColor: null,
                        plotBorderWidth: null,
                        plotShadow: false,
                        type: 'pie',
                    },
                    title: null,
                    tooltip: {
                        pointFormat: '{series.name}: <b>{point.y:.0f}</b> ({point.percentage:.1f}%)'
                    },
                    accessibility: {
                        point: {
                        valueSuffix: '%'
                        }
                    },
                    plotOptions: {
                        pie: {
                        allowPointSelect: true,
                        cursor: 'pointer',
                        animation: false,
                        dataLabels: {
                                enabled: true,
                                format: '<b>{point.name}</b>: {point.percentage:.1f} %'
                            }
                        }
                    },
                    series: [{
                        name: 'Tasks',
                        colorByPoint: true,
                        cursor: 'pointer',
                            point: {
                                events: {
                                    click: function () {
                                        location.href = this.options.url;
                                    }
                                }
                            },
                        data: data.data
                        }]
                    });
            });
    </script>
</figure>
